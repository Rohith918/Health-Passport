apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-passport-app
  namespace: health-passport
  labels:
    app: health-passport-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-passport-app
  template:
    metadata:
      labels:
        app: health-passport-app
    spec:
      containers:
        - name: app
          # CI overwrites this tag on every deploy — see .github/workflows/deploy.yml
          image: <ECR_REPOSITORY_URL>:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: health-passport-service
  namespace: health-passport
spec:
  type: ClusterIP
  selector:
    app: health-passport-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
