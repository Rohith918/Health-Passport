# Requires terraform/backup.tf to have been applied first (S3 bucket + IRSA
# role). Replace the role-arn annotation below with the
# `pg_backup_role_arn` terraform output.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup
  namespace: health-passport
  annotations:
    eks.amazonaws.com/role-arn: "<PG_BACKUP_ROLE_ARN>" # from terraform output
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: health-passport
spec:
  schedule: "0 8 * * *" # daily, 08:00 UTC
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: postgres-backup
          restartPolicy: OnFailure
          containers:
            - name: pg-backup
              image: postgres:15-alpine
              command:
                - /bin/sh
                - -c
                - |
                  apk add --no-cache aws-cli >/dev/null
                  FILE="backup-$(date +%Y%m%d-%H%M%S).sql.gz"
                  pg_dump -h postgres -U "$POSTGRES_USER" "$POSTGRES_DB" | gzip > "/tmp/$FILE"
                  aws s3 cp "/tmp/$FILE" "s3://$BACKUP_BUCKET/$FILE"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secrets
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secrets
                      key: POSTGRES_USER
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secrets
                      key: POSTGRES_DB
                - name: BACKUP_BUCKET
                  value: "<PG_BACKUP_BUCKET_NAME>" # from terraform output
