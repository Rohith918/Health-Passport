# DO NOT commit a filled-in version of this file. Apply it directly via
# kubectl after substituting real values, or generate it in CI from
# GitHub Actions secrets (see .github/workflows/deploy.yml).
#
#   kubectl create secret generic postgres-secrets -n health-passport \
#     --from-literal=POSTGRES_USER=postgres \
#     --from-literal=POSTGRES_PASSWORD='<strong-random-password>' \
#     --from-literal=POSTGRES_DB=healthdb
#
#   kubectl create secret generic app-secrets -n health-passport \
#     --from-literal=JWT_SECRET='<strong-random-secret>'
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: health-passport
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: "<CHANGE_ME>"
  POSTGRES_DB: healthdb
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: health-passport
stringData:
  JWT_SECRET: "<CHANGE_ME>"
